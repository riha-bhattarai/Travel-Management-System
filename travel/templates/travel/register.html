<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PS Travel Point Tours - Register</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.45)
                ),
                url("https://images.unsplash.com/photo-1544735716-392fe2489ffa?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

        }


        .register-box {

            width: 400px;

            background: rgba(255, 255, 255, 0.96);

            padding: 40px;

            border-radius: 18px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);

            text-align: center;

        }


        .logo {

            font-size: 45px;

            margin-bottom: 10px;

        }


        .register-box h1 {

            margin: 0;

            color: #1d3557;

            font-size: 27px;

        }


        .subtitle {

            color: #777;

            margin-top: 8px;

            margin-bottom: 30px;

            font-size: 15px;

        }


        .form-group {

            text-align: left;

            margin-bottom: 20px;

        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #333;

            font-weight: bold;

            font-size: 14px;

        }


        .form-group input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d5d5d5;

            border-radius: 8px;

            font-size: 14px;

            outline: none;

            transition: 0.3s;

        }


        .form-group input:focus {

            border-color: #1976d2;

            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.12);

        }


        .register-button {

            width: 100%;

            padding: 13px;

            background: #1976d2;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }


        .register-button:hover {

            background: #125ca5;

            transform: translateY(-1px);

        }


        .message {

            background: #fff3cd;

            color: #856404;

            padding: 10px;

            margin-bottom: 20px;

            border-radius: 7px;

            font-size: 14px;

        }


        .login-link {

            margin-top: 25px;

            color: #666;

            font-size: 14px;

        }


        .login-link a {

            color: #1976d2;

            font-weight: bold;

            text-decoration: none;

        }


        .login-link a:hover {

            text-decoration: underline;

        }


        .back-home {

            margin-top: 15px;

        }


        .back-home a {

            color: #555;

            text-decoration: none;

            font-size: 13px;

        }


        .back-home a:hover {

            color: #1976d2;

        }


        @media (max-width: 500px) {

            .register-box {

                width: 90%;

                padding: 30px 25px;

            }

        }

    </style>

</head>


<body>


<div class="register-box">


    <div class="logo">
        ✈️
    </div>


    <h1>
        PS Travel Point Tours
    </h1>


    <p class="subtitle">
        Create Your Account
    </p>


    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm your password"
                required
            >

        </div>


        <button
            type="submit"
            class="register-button"
        >
            Register
        </button>

    </form>


    <div class="login-link">

        <p>
            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </div>


    <div class="back-home">

        <a href="{% url 'home' %}">
            ← Back to Home
        </a>

    </div>


</div>


</body>

</html>
