<!DOCTYPE html>

<html>

<head>

<title>PS Travel Point Tours - Register</title>

<style>

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;

        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 100vh;
    }

    .register-box {
        background: white;
        width: 350px;

        padding: 35px;

        border-radius: 10px;

        box-shadow: 0 4px 15px rgba(0,0,0,0.15);

        text-align: center;
    }

    .register-box h1 {
        margin-bottom: 5px;
    }

    .subtitle {
        color: #666;
        margin-bottom: 30px;
    }

    .form-group {
        text-align: left;
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
    }

    .form-group input {
        width: 100%;
        padding: 12px;

        border: 1px solid #ccc;
        border-radius: 5px;

        box-sizing: border-box;
    }

    .register-button {
        width: 100%;

        padding: 12px;

        background: #333;
        color: white;

        border: none;
        border-radius: 5px;

        font-size: 16px;

        cursor: pointer;
    }

    .register-button:hover {
        background: #555;
    }

    .login-link {
        margin-top: 20px;
    }

    .login-link a {
        color: #333;
        font-weight: bold;
        text-decoration: none;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    .message {
        background: #f0f0f0;

        padding: 10px;

        margin-bottom: 20px;

        border-radius: 5px;
    }

</style>

</head>

<body>

<div class="register-box">

<h1>PS Travel Point Tours</h1>

<p class="subtitle">
    Create Your Account
</p>


{% if messages %}

    {% for message in messages %}

        <div class="message">
            {{ message }}
        </div>

    {% endfor %}

{% endif %}


<form method="POST">

    {% csrf_token %}


    <div class="form-group">

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter your username"
            required
        >

    </div>


    <div class="form-group">

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

    </div>


    <div class="form-group">

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

    </div>

    <div class="form-group">

        <label>Confirm Password</label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm your password"
            required
        >

    </div>


    <button
        type="submit"
        class="register-button"
    >
        Register
    </button>

</form>


<div class="login-link">

    <p>
        Already have an account?
        <a href="{% url 'login' %}">
            Login
        </a>
    </p>

</div>


</div>

</body>

</html>
